- title: Visual Looped Transformer 기반 Continual Learning
  slug: looped-transformer-continual-learning
  title_en: "Continual Learning on a Visual Looped Transformer"
  summary_en: "A looped VLM gains depth by reusing the same blocks instead of adding parameters. With one as the backbone, we measure forgetting as it learns domains and skills in sequence."
  period_en: "2026.10 – present"
  period: 2026.10 – 진행 중
  subtitle: "Continual learning on a looped vision-language model"
  thumb: /assets/images/projects/loopvl-arch.png
  category: research
  summary: 파라미터 대신 반복 호출로 깊이를 버는 Looped VLM을 백본으로 삼아, 도메인과 능력을 순차 학습할 때의 망각을 측정합니다.
  stack: ["LoopVL", "Looped Transformer", "Continual Learning", "MLLM-CL", "LoRA"]

  figures:
    - src: /assets/images/projects/loopvl-arch.png
      caption: >-
        기반 모델 LoopVL의 구조 (논문 Figure 2a에서 발췌). L 모듈을 3회 반복하고
        L/H 쌍을 다시 2회 반복해, 32개 고유 레이어로 128번의 레이어 호출을 만듭니다.
      caption_en: >-
        Architecture of the base model LoopVL (from Figure 2a of the LoopVL paper). The L module loops
        three times and the L/H pair loops twice more, so 32 unique layers make 128 layer calls.

  metrics:
    - value: "36.40 → 60.24"
      label: "DCL 5개 도메인 평균 (zero-shot → 순차 학습 후)"
      label_en: "DCL average over 5 domains (zero-shot → after sequential training)"
    - value: "55.64"
      label: "ACL 4개 능력 zero-shot 평균 (LLaVA-7B 33.05)"
      label_en: "ACL zero-shot average over 4 skills (LLaVA-7B: 33.05)"
    - value: "r = 32"
      label: "LoRA — q, k, v, o에 적용"
      label_en: "LoRA on q, k, v and o"
    - value: "5 + 4"
      label: "순차 학습 task (도메인 5 · 능력 4)"
      label_en: "Sequential tasks (5 domains · 4 skills)"

  sections:
    - label: 왜 looped transformer인가
      label_en: Why looped transformers
      text: >-
        LLM은 스케일링 법칙을 따라 파라미터를 키우는 쪽으로 발전해 왔고, 학습과 서빙
        비용도 그만큼 같이 올랐습니다. looped transformer는 다른 축을 택합니다.
        파라미터를 늘리는 대신 같은 블록을 여러 번 되불러 유효 깊이를 벌고, 깊이에
        민감한 추론 과제에서 훨씬 적은 파라미터로 더 나은 성능을 냅니다. 강건한 추론을
        더 적은 파라미터로 확보하는, 곧 더 효율적인 경로입니다.
      text_en: >-
        LLMs have grown by scaling up parameters, and training and serving costs have grown with them.
        Looped transformers take another axis: instead of adding parameters, they call the same blocks
        again and again to gain effective depth, and on depth-sensitive reasoning tasks they do better
        with far fewer parameters. That makes them a more efficient route to robust reasoning.

    - label: 문제
      label_en: Problem
      text: >-
        그런데 멀티모달 LLM에 새 도메인이나 능력을 순차적으로 가르치면 앞서 배운 것을
        잊습니다. 지금까지의 continual learning 연구는 LLaVA처럼 레이어를 한 번씩만
        통과하는 백본 위에서만 이루어졌고, looped transformer에서 순차 학습이 다뤄진
        적은 없습니다. 같은 가중치가 반복 호출마다 다시 쓰이는 구조에서는 한 task를 위한
        업데이트가 모든 반복에 동시에 반영되고 학습되는 가중치 자체도 적어서, 망각의
        양상이 달라질 여지가 있습니다. 이 프로젝트는 그 빈자리를 측정합니다.
      text_en: >-
        But when a multimodal LLM is taught new domains or skills one after another, it forgets what it
        learned before. Continual learning research has so far used only backbones that pass through
        each layer once, like LLaVA; sequential learning on looped transformers has not been studied.
        When the same weights are reused at every iteration, an update for one task lands on all
        iterations at once and fewer weights are trained, so forgetting may behave differently. This
        project measures that gap.

    - label: 목표
      label_en: Goal
      text: >-
        looped transformer의 강한 추론 성능을 continual learning으로 옮기는 것이
        목표입니다. 기존 모델보다 적은 파라미터로 더 나은 추론을 하면서, catastrophic
        forgetting 없이 여러 도메인과 능력을 차례로 익혀 쓸 수 있는 범위를 넓히는
        VLM을 만듭니다.
      text_en: >-
        The goal is to carry the strong reasoning of looped transformers into continual learning: a VLM
        that reasons better than existing models with fewer parameters, and widens what it can do by
        learning domains and skills in turn without catastrophic forgetting.

    - label: 깊이가 추론을 만든다
      label_en: Depth drives reasoning
      text: >-
        파라미터보다 깊이가 추론을 좌우한다는 근거는 언어와 비전 양쪽에서 따로
        보고되었습니다. 같은 FLOPs 아래에서 파라미터를 절반으로 줄인 looped 모델이
        non-looped 기준선의 추론 성능을 넘습니다.
      text_en: >-
        Evidence that depth, more than parameters, drives reasoning has been reported separately for
        language and for vision. At equal FLOPs, a looped model with half the parameters beats the
        reasoning of a non-looped baseline.
      table:
        head: ["모델 (층 ⊗ loop)", "파라미터", "Val. PPL ↓", "수학 문장제 ↑", "추론 프리미티브 ↑"]
        rows:
          - ["24 ⊗ 1 — non-looped 기준선", "24x", "**7.40**", "29.3", "47.5"]
          - ["12 ⊗ 2 — looped", "12x", "7.90", "**34.3**", "51.2"]
          - ["6 ⊗ 4 — looped", "6x", "8.42", "29.8", "**56.1**"]
        caption: >-
          Saunshi et al., Reasoning with Latent Thoughts (ICLR 2025, arXiv:2502.17416),
          1B 규모 · 동일 FLOPs. looped 모델은 perplexity가 더 나쁜데도 추론 과제에서는
          파라미터가 2–4배인 non-looped 기준선을 넘습니다.
      table_en:
        head: ["Model (layers ⊗ loops)", "Params", "Val. PPL ↓", "Math word problems ↑", "Reasoning primitives ↑"]
        rows:
          - ["24 ⊗ 1 — non-looped baseline", "24x", "**7.40**", "29.3", "47.5"]
          - ["12 ⊗ 2 — looped", "12x", "7.90", "**34.3**", "51.2"]
          - ["6 ⊗ 4 — looped", "6x", "8.42", "29.8", "**56.1**"]
        caption: >-
          Saunshi et al., Reasoning with Latent Thoughts (ICLR 2025, arXiv:2502.17416), 1B scale · equal
          FLOPs. The looped models have worse perplexity, yet on reasoning tasks they beat non-looped
          baselines with 2–4× the parameters.

    - text: >-
        비전·언어 쪽에서도 같은 경향이 나타납니다. LoopVL-1B는 학습 토큰이 수십 배
        적은데도 추론 벤치마크에서 2–4B급 모델들을 앞섭니다.
      text_en: >-
        The same holds for vision-language. LoopVL-1B is trained on tens of times fewer tokens, yet it
        beats 2–4B models on reasoning benchmarks.
      table:
        head: ["모델", "학습 토큰", "MathVision ↑", "MMK12-Math ↑", "MMMU-Pro ↑", "MMStar ↑"]
        rows:
          - ["**LoopVL-1B**", "0.14T", "**38.49**", "**61.60**", "**38.67**", "**63.47**"]
          - ["Qwen3.5-2B", "36T", "38.40", "35.00", "24.90", "55.10"]
          - ["InternVL3.5-4B", "36.38T", "22.04", "54.80", "38.30", "63.20"]
          - ["gemma-4 E4B-it", "11T", "19.64", "37.40", "33.06", "51.13"]
          - ["LFM2.5-VL-1.6B", "28.1T", "16.51", "30.80", "24.22", "48.53"]
      table_en:
        head: ["Model", "Training tokens", "MathVision ↑", "MMK12-Math ↑", "MMMU-Pro ↑", "MMStar ↑"]
        rows:
          - ["**LoopVL-1B**", "0.14T", "**38.49**", "**61.60**", "**38.67**", "**63.47**"]
          - ["Qwen3.5-2B", "36T", "38.40", "35.00", "24.90", "55.10"]
          - ["InternVL3.5-4B", "36.38T", "22.04", "54.80", "38.30", "63.20"]
          - ["gemma-4 E4B-it", "11T", "19.64", "37.40", "33.06", "51.13"]
          - ["LFM2.5-VL-1.6B", "28.1T", "16.51", "30.80", "24.22", "48.53"]

    - label: 벤치마크
      label_en: Benchmark
      text: >-
        MLLM-CL(arXiv:2506.05453)을 씁니다. 두 트랙으로 나뉘는데, DCL은 서로 다른
        도메인 지식을 차례로 쌓는 IID 설정이고, ACL은 모델의 기본 능력 자체를 차례로
        키우는 non-IID 설정입니다. 학습 순서는 표의 위에서 아래 순입니다.
      text_en: >-
        We use MLLM-CL (arXiv:2506.05453). It has two tracks: DCL adds knowledge of different domains in
        turn (IID), and ACL grows the model's core skills in turn (non-IID). Tasks are learned from the
        top of each table down.
      table:
        head: ["DCL — 도메인", "과제", "학습 / 평가", "출처"]
        rows:
          - ["RS — 원격탐사", "위성·항공 영상 VQA", "60k / 10k", "RSVQA"]
          - ["Med — 의료", "병리 영상 VQA", "22.8k / 9.8k", "PathVQA"]
          - ["AD — 자율주행", "주행 장면 QA", "60k / 10k", "DriveLM"]
          - ["Sci — 과학", "도표·지도 과학 QA", "33.4k / 8.2k", "AI2D, SciVerse, MapQA, TQA"]
          - ["Fin — 금융", "주식 차트 QA", "60k / 10k", "StockQA (FinVis 재작성)"]
      table_en:
        head: ["DCL — domain", "Task", "Train / test", "Source"]
        rows:
          - ["RS — remote sensing", "Satellite and aerial image VQA", "60k / 10k", "RSVQA"]
          - ["Med — medical", "Pathology image VQA", "22.8k / 9.8k", "PathVQA"]
          - ["AD — autonomous driving", "Driving-scene QA", "60k / 10k", "DriveLM"]
          - ["Sci — science", "Science QA on diagrams and maps", "33.4k / 8.2k", "AI2D, SciVerse, MapQA, TQA"]
          - ["Fin — finance", "Stock-chart QA", "60k / 10k", "StockQA (rewritten from FinVis)"]

    - table:
        head: ["ACL — 능력", "과제", "학습", "평가셋"]
        rows:
          - ["OCR", "문자 인식", "128.1k", "OCRBench"]
          - ["M&L — 수학·논리", "수식·논리 추론", "526.1k", "MathVista"]
          - ["VP — 시각 지각", "개수 세기 등 지각 과제", "119.9k", "CV-Bench (Counting)"]
          - ["GUI — 에이전트", "화면 이해·조작", "147.3k", "MMTBench-GUI"]
        caption: >-
          지표는 네 가지입니다. MFT는 각 task를 막 배운 직후 정확도의 평균, MFN은
          전체 순차 학습을 끝낸 뒤 모든 task 정확도의 평균, MAA는 매 단계마다의 평균
          정확도를 다시 평균한 값, BWT는 최종 정확도와 학습 직후 정확도의 차이입니다.
      table_en:
        head: ["ACL — skill", "Task", "Train", "Test set"]
        rows:
          - ["OCR", "Text recognition", "128.1k", "OCRBench"]
          - ["M&L — math & logic", "Math and logical reasoning", "526.1k", "MathVista"]
          - ["VP — visual perception", "Perception tasks such as counting", "119.9k", "CV-Bench (Counting)"]
          - ["GUI — agent", "Screen understanding and operation", "147.3k", "MMTBench-GUI"]
        caption: >-
          Four metrics: MFT averages each task's accuracy right after it is learned; MFN averages every
          task's accuracy after the whole sequence; MAA averages the mean accuracy over learned tasks
          after each step; BWT is the change from just-learned to final accuracy.

    - label: 학습 설정
      label_en: Training setup
      text: >-
        LoopVL 백본을 얼리고 어텐션의 q, k, v, o 투영에만 LoRA(r = 32)를 걸어 task를
        차례로 학습합니다. looped 구조에서는 같은 어댑터가 반복 호출마다 다시 적용되므로,
        non-looped 백본과 같은 rank라도 실제로 관여하는 횟수가 다릅니다.
      text_en: >-
        We freeze the LoopVL backbone and train LoRA (r = 32) only on the attention q, k, v and o
        projections, one task after another. In a looped model the same adapter is applied again at
        every iteration, so at the same rank it acts a different number of times than in a non-looped
        backbone.

    - label: 결과 — DCL (진행 중)
      label_en: Results — DCL (ongoing)
      text: >-
        5개 도메인을 RS → Med → AD → Sci → Fin 순서로 차례로 학습한 뒤, 마지막 Fin 체크포인트로 전 도메인을 평가했습니다.
        순차 학습 방법은 두 가지를 비교했습니다. LoRA-FT는 하나의 LoRA 어댑터를 task마다 이어서 학습하는
        가장 기본적인 방법이고, O-LoRA는 새 task의 LoRA를 이전 task들의 LoRA 부분공간과 직교하도록 학습해
        task 사이의 간섭을 줄이는 continual learning 방법입니다.
      text_en: >-
        We trained the five domains in the order RS → Med → AD → Sci → Fin and evaluated all of them
        with the final Fin checkpoint. We compared two sequential methods: LoRA-FT, the basic approach
        that keeps training one LoRA adapter task after task, and O-LoRA, a continual learning method
        that learns each new task's LoRA orthogonal to the earlier tasks' LoRA subspaces to reduce
        interference between tasks.
      table:
        head: ["Method", "RS", "Med", "AD", "Sci", "Fin", "MFT ↑", "MFN ↑", "MAA ↑", "BWT ↑"]
        rows:
          - ["LLaVA-1.5-7B · Zero-shot", "32.29", "28.28", "15.59", "35.55", "62.56", "34.85", "—", "—", "—"]
          - ["LLaVA-1.5-7B · LoRA-FT", "69.65", "41.59", "25.43", "40.88", "87.45", "64.98", "53.00", "61.13", "−14.97"]
          - ["LoopVL · Zero-shot", "38.83", "29.86", "14.89", "40.16", "58.28", "36.40", "—", "—", "—"]
          - ["LoopVL · LoRA-FT", "73.34", "**46.65**", "**40.78**", "**57.48**", "**82.96**", "**70.54**", "**60.24**", "**66.85**", "**−12.87**"]
          - ["LoopVL · O-LoRA", "**78.19**", "41.98", "36.42", "48.85", "78.82", "67.67", "56.85", "64.88", "−13.53"]
        caption: >-
          LLaVA 두 행은 MLLM-CL 논문 Table 2의 보고값이고, LoopVL 세 행이 우리 실측값입니다.
          도메인 칸은 순차 학습을 모두 끝낸 뒤의 점수(Last Accuracy)이며 그 평균이 MFN입니다.
          BWT는 점수 차이(%p)로 0에 가까울수록 좋고, 굵게는 LoopVL 실측 중 최고값입니다.
        caption_en: >-
          The two LLaVA rows are reported in Table 2 of the MLLM-CL paper; the three LoopVL rows are our
          measurements. Domain columns are scores after the whole sequence (Last Accuracy), and their mean
          is MFN. BWT is a score difference (%p), better closer to 0; bold marks the best of our LoopVL
          runs.

    - label: 분석 — stability가 다음 과제
      label_en: Analysis — stability is next
      text: >-
        LoopVL은 새 도메인을 잘 받아들입니다. 각 task를 막 배운 직후의 평균(MFT)은 LoRA-FT 기준 70.54이고,
        순차 학습을 모두 끝낸 뒤의 평균(MFN)도 60.24로 7배 큰 LLaVA-1.5-7B(53.00)보다 7.2점 높습니다.
        반면 BWT는 LoRA-FT −12.87, O-LoRA −13.53으로, 앞서 배운 도메인의 점수가 마지막까지 약 13점 떨어집니다.
        두 방법 모두 loop-aware하지 않기 때문입니다. looped 구조에서는 같은 어댑터가 반복 호출마다 다시 적용되어
        새 task를 위한 업데이트가 모든 반복에 한꺼번에 반영되는데, 기존 방법들은 이를 레이어를 한 번씩만 통과하는
        구조처럼 다룹니다. task 간 간섭을 막도록 설계된 O-LoRA도 BWT를 개선하지 못했습니다.
        새 지식을 받아들이는 plasticity는 충분하고, 이전 지식을 지키는 stability를 보완하는 loop-aware
        continual learning 방법이 다음 단계입니다.
      text_en: >-
        LoopVL takes in new domains well. The average right after learning each task (MFT) is 70.54 with
        LoRA-FT, and the average after the whole sequence (MFN) is 60.24, 7.2 points above LLaVA-1.5-7B
        (53.00), a model seven times larger. BWT, however, is −12.87 for LoRA-FT and −13.53 for O-LoRA:
        earlier domains lose about 13 points by the end. Neither method is loop-aware. In a looped model
        the same adapter is reapplied at every iteration, so an update for a new task lands on every
        iteration at once, yet existing methods treat the model as if each layer were passed only once.
        Even O-LoRA, built to prevent interference between tasks, did not improve BWT. Plasticity,
        taking in new knowledge, is sufficient; the next step is a loop-aware continual learning method
        that adds stability, keeping what was learned.

    - label: 결과 — ACL (진행 중)
      label_en: Results — ACL (ongoing)
      text: >-
        능력 트랙은 순차 학습 전의 zero-shot 결과입니다. 학습을 시작하기도 전에
        4개 능력 평균이 LLaVA-1.5-7B보다 22.6점 높고, 특히 OCR과 수학·논리에서 차이가 큽니다.
      text_en: >-
        The skill track shows zero-shot results before sequential training. Even before any training,
        the four-skill average is 22.6 points above LLaVA-1.5-7B, with the largest gaps in OCR and math
        & logic.
      table:
        head: ["Method", "OCR", "M&L", "VP", "GUI", "MFT ↑"]
        rows:
          - ["LLaVA-1.5-7B · Zero-shot", "31.20", "30.20", "**60.79**", "10.00", "33.05"]
          - ["**LoopVL · Zero-shot**", "**70.30**", "**58.90**", "65.48", "**27.88**", "**55.64**"]
        caption: >-
          LLaVA 행은 MLLM-CL 논문 Table 3의 보고값, LoopVL 행이 우리 실측값입니다.
        caption_en: >-
          The LLaVA row is reported in Table 3 of the MLLM-CL paper; the LoopVL row is our measurement.

  note: 진행 중인 프로젝트입니다.
  note_en: This project is ongoing.

- title: Omni-modal LLM을 위한 Token Pruning
  slug: omnimodal-token-pruning
  title_en: "Token Pruning for Omni-modal LLMs"
  summary_en: "Drops the tokens their neighbours can already reconstruct, keeping accuracy while cutting audio and video tokens to under half."
  period: 2026.03 – 2026.09
  subtitle: "Training-free token pruning for omni-modal LLMs by reconstructing layer-wise orthogonal updates"
  thumb: /assets/images/projects/omni-token-pruning/overview.png
  category: research
  summary: 주변 토큰으로 복원되는 토큰을 골라 버려, 오디오·비디오 토큰을 절반 이하로 줄이면서 성능을 지킵니다.
  stack: ["OmniLLM", "Token Pruning", "Qwen2.5-Omni", "Training-free"]

  problem: >-
    오디오와 비디오를 함께 받는 옴니모달 LLM은 입력 토큰 수가 폭발적으로 늘어나
    연산량과 메모리를 크게 잡아먹습니다. 기존 토큰 프루닝은 토큰 하나의 중요도나
    두 토큰 사이의 유사도만 보는데, 여러 토큰이 힘을 합쳐 어떤 토큰을 대신할 수
    있는지는 보지 않습니다.

  approach: >-
    각 레이어에서 토큰에 새로 더해지는 업데이트만 떼어내 직교화한 뒤, 주변 토큰들의
    업데이트로 그것을 복원해봅니다. 잘 복원된다면 그 토큰이 새로 가져온 정보가 없다는
    뜻이므로 버려도 됩니다. 인코더 단계에서는 같은 모달리티 안에서 복원해보고 인코더
    어텐션과 합치고, LLM 내부에서는 같은 시간 구간의 오디오 토큰으로 비디오 업데이트를
    복원해보고 질문 어텐션과 합쳐 레이어를 지날 때마다 점진적으로 줄입니다. 추가 학습이
    필요 없습니다.

  metrics:
    - value: "99.9%"
      label: "토큰 45%에서 원본 대비 성능"
    - value: "3.3배"
      label: "prefill 단축 (5,154 → 1,584ms)"
    - value: "−14.4GiB"
      label: "GPU 메모리 (43.8 → 29.4GiB)"
    - value: "−0.3p"
      label: "정확도 변화 (46.8 → 46.5)"

  result: >-
    Qwen2.5-Omni-7B에서 오디오·비디오 토큰을 45%만 남기고도 전체 토큰을 쓸 때의
    99.9% 성능을 유지했고, 35%까지 줄여도 99.3%였습니다. 같은 토큰 예산에서 비교한
    기존 프루닝 방법들(99.4%, 99.1%)보다 높습니다. 효율 쪽에서는 토큰 35% 기준으로
    정확도를 0.3포인트만 내주면서 prefill 시간을 약 3.3배, GPU 메모리를 14GiB 이상,
    종단 지연을 8.31초에서 5.02초로 줄였습니다.

  figures:
    - src: /assets/images/projects/prune-tradeoff.jpg
      caption: 왼쪽은 각 방법이 남긴 토큰, 오른쪽은 prefill 시간 대비 정확도. 제안 방법은 토큰 45%에서 전체 토큰과 거의 같은 정확도에 도달

