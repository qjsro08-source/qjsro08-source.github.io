- title: 로컬 LLM 육아 상담 챗봇
  slug: local-llm-parenting-chatbot
  title_en: "Local LLM Parenting Chatbot"
  summary_en: "A parenting chatbot aimed at on-device use: a parenting QA set built from public data, LoRA tuning, and a comparison with four commercial APIs under the same conditions."
  period: 2026.05
  subtitle: "A parenting assistant built to run on-device, answering from the child’s own records"
  thumb: /assets/images/projects/chatbot-thumb.jpg
  category: application
  summary: 온디바이스를 목표로 만든 육아 상담 챗봇. 공개 QA로 데이터셋을 만들어 LoRA로 튜닝하고, 상용 API 4종과 같은 조건에서 비교했습니다.
  stack: ["Gemma 4 E4B", "LoRA", "Q4_0 양자화", "RAG", "PyTorch"]

  problem: >-
    육아 상담은 아이의 수유·배변·발열 기록처럼 민감한 개인정보를 그대로 다룹니다.
    게다가 부모는 같은 상황을 하루에도 몇 번씩 되묻기 때문에 상용 API를 계속 호출하면
    비용이 빠르게 불어납니다. 개인정보를 밖으로 내보내지 않으면서 비용도 들지 않는
    방법이 필요했습니다.

  approach: >-
    Gemma 4 E4B를 육아 도메인 데이터로 LoRA 파인튜닝한 뒤 Q4_0으로 양자화해
    로컬에서 실행했습니다. 답변은 관찰된 사실 · 일반 설명 · 권장 행동 · 되묻기로 나누어
    내보내고, 각 문장에는 근거가 된 아이 기록을 함께 달게 하되, 기록으로 뒷받침되지
    않는 내용은 따로 표시하도록 했습니다. 비교할 때는 질문 분류 · 기록 조회 ·
    전문자료 검색 · 근거 압축까지의 앞단 파이프라인을 모든 모델에 똑같이 고정하고
    답변 모델만 바꿨습니다.

  metrics:
    - value: "$0"
      label: "API 비용 (상용 $0.018–0.35)"
    - value: "38턴"
      label: "대화 10세트, 모델 5종 비교"
    - value: "로컬 실행"
      label: "외부 API 호출 없음"

  result: >-
    같은 대화 10세트 38턴을 GPT-5.6 Luna, DeepSeek V4 Flash, Gemini 3.6 Flash,
    Claude Haiku 4.5와 나란히 돌려 비교했습니다. 내부 비교에서 답변의 구조와 근거
    표기를 상용 모델과 견줄 만한 수준으로 유지했고, API 호출 없이 아이 기록을 외부로
    내보내지 않고도 같은 형식의 답변을 냈습니다.


  example:
    question: 언제까지 지켜봐도 돼요?
    answer:
      - label: 관찰된 사실
        text: 구토는 2026년 8월 3일과 4일에 각각 1회씩 기록되어 있습니다.
      - label: 일반 설명
        text: 구토와 설사가 함께 나타나는 경우 장염의 가능성을 고려할 수 있으나, 다른 원인도 있을 수 있습니다.
      - label: 권장 행동
        text: 발열 여부와 체온, 수유·수분 섭취량, 젖은 기저귀 수 등 탈수 징후를 확인해야 합니다.

- title: 단일 이미지로부터의 3D 장면 복원
  slug: single-image-3d-scene
  title_en: "3D Scene Reconstruction from a Single Image"
  summary_en: "Splits one photo into foreground, background and sky and rebuilds each layer, recovering even the background hidden behind objects."
  period: 2025.12 – 2026.04
  subtitle: "Layer-wise 3D scene reconstruction from a single image"
  thumb: /assets/images/projects/3d-qualitative.jpg
  category: research
  summary: 사진 한 장을 전경·배경·하늘로 나눠 층별로 복원해, 가려져 있던 배경까지 살린 3D 장면을 만듭니다.
  stack: ["3D Gaussian Splatting", "Diffusion Inpainting", "SAM3", "LLaVA-OneVision"]

  problem: >-
    사진 한 장으로 3D 장면을 만들면, 앞에 선 사람이나 물체가 가린 배경은 정보가
    아예 없습니다. 기존의 학습 없이 동작하는 3DGS 방법들은 장면 전체를 하나의
    가우시안 집합으로 최적화하기 때문에, 가려졌던 배경이 끝내 복원되지 않고
    카메라를 옆으로 옮기면 물체와 배경의 경계가 무너집니다.
  problem_en: >-
    When a 3D scene is built from a single photo, the background hidden behind people or objects
    carries no information at all. Existing training-free 3DGS methods optimize the whole scene as
    one set of Gaussians, so the occluded background is never recovered and the boundary between
    objects and background breaks down as the camera moves sideways.

  approach: >-
    장면을 전경·배경·하늘 세 개의 층으로 먼저 나눕니다. 전경을 지우고 그 자리에
    가려져 있던 배경을 인페인팅으로 복원한 뒤, 각 층을 서로 파라미터가 겹치지 않는
    독립적인 3D 가우시안 장면으로 재구성합니다. 층끼리 간섭하지 않으므로 경계가
    뭉개지지 않습니다. 마지막에 세 층을 하나로 병합하고 원본 시점을 기준으로 다시
    정합해 novel-view 렌더링에 사용합니다. 별도의 대규모 3D 학습은 필요하지 않습니다.
  approach_en: >-
    The scene is first split into three layers: foreground, background and sky. The foreground is
    removed and the background it hid is filled in by inpainting; then each layer is reconstructed
    as an independent set of 3D Gaussians with no shared parameters. Because the layers do not
    interfere, boundaries stay sharp. Finally the three layers are merged, re-aligned to the
    original view and used for novel-view rendering. No large-scale 3D training is needed.

  metrics:
    - value: "79.32"
      label: "WorldScore 평균 (2위 77.16)"
      label_en: "WorldScore average (runner-up 77.16)"
    - value: "90.55"
      label: "3D 일관성 — 1위"
      label_en: "3D consistency — 1st"
    - value: "92.33"
      label: "광학 일관성 — 1위"
      label_en: "Photometric consistency — 1st"
    - value: "91.93"
      label: "스타일 일관성 — 1위"
      label_en: "Style consistency — 1st"

  result: >-
    WorldScore 벤치마크에서 기존 3D 장면 생성 방법 6종과 비교해 평균 79.32로 가장
    높았습니다. 특히 시점을 옮겼을 때의 일관성을 보는 세 지표에서 모두 1위였습니다.
    정성적으로도 가려짐 때문에 생기던 구멍이 줄고, 전경과 배경의 경계와 깊이가
    더 안정적으로 유지됩니다.
  result_en: >-
    On the WorldScore benchmark it scored the highest average, 79.32, against six existing 3D scene
    generation methods, and ranked first on all three metrics of consistency under camera motion.
    Qualitatively, holes from occlusion shrink and the boundary and depth between foreground and
    background stay more stable.


  figures:
    - src: /assets/images/projects/3d-pipeline.jpg
      caption: 2단계 파이프라인 — 층 분해와 가려진 배경 복원(Stage 1), 층별 가우시안 재구성과 병합(Stage 2)
      caption_en: "Two-stage pipeline: layer decomposition and recovery of the hidden background (Stage 1), per-layer Gaussian reconstruction and merging (Stage 2)"
    - src: /assets/images/projects/3d-qualitative.jpg
      caption: 기존 방법과의 정성 비교. 빨간 상자가 전경–배경 경계이며, 오른쪽이 제안 방법
      caption_en: "Qualitative comparison with existing methods. Red boxes mark foreground–background boundaries; ours is on the right."

