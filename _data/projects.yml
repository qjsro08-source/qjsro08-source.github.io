- title: Visual Looped Transformer 기반 Continual Learning
  slug: looped-transformer-continual-learning
  period: 2026 — 진행 중
  summary: 파라미터 대신 반복 호출로 깊이를 버는 Looped VLM을 백본으로 삼아, 도메인과 능력을 순차 학습할 때의 망각을 측정합니다.
  stack: ["LoopVL", "Looped Transformer", "Continual Learning", "MLLM-CL", "LoRA"]

  figures:
    - src: /assets/images/projects/loopvl-arch.png
      caption: >-
        기반 모델 LoopVL의 구조 (논문 Figure 2a에서 발췌). L 모듈을 3회 반복하고
        L/H 쌍을 다시 2회 반복해, 32개 고유 레이어로 128번의 레이어 호출을 만듭니다.

  metrics:
    - value: "36.40 → 60.24"
      label: "DCL 5개 도메인 평균 (zero-shot → 순차 학습 후)"
    - value: "55.64"
      label: "ACL 4개 능력 zero-shot 평균 (LLaVA-7B 33.05)"
    - value: "r = 32"
      label: "LoRA — q, k, v, o에 적용"
    - value: "5 + 4"
      label: "순차 학습 task (도메인 5 · 능력 4)"

  sections:
    - label: 왜 looped transformer인가
      text: >-
        LLM은 스케일링 법칙을 따라 파라미터를 키우는 쪽으로 발전해 왔고, 학습과 서빙
        비용도 그만큼 같이 올랐습니다. looped transformer는 다른 축을 택합니다.
        파라미터를 늘리는 대신 같은 블록을 여러 번 되불러 유효 깊이를 벌고, 깊이에
        민감한 추론 과제에서 훨씬 적은 파라미터로 더 나은 성능을 냅니다. 강건한 추론을
        더 적은 파라미터로 확보하는, 곧 더 효율적인 경로입니다.

    - label: 문제
      text: >-
        그런데 멀티모달 LLM에 새 도메인이나 능력을 순차적으로 가르치면 앞서 배운 것을
        잊습니다. 지금까지의 continual learning 연구는 LLaVA처럼 레이어를 한 번씩만
        통과하는 백본 위에서만 이루어졌고, looped transformer에서 순차 학습이 다뤄진
        적은 없습니다. 같은 가중치가 반복 호출마다 다시 쓰이는 구조에서는 한 task를 위한
        업데이트가 모든 반복에 동시에 반영되고 학습되는 가중치 자체도 적어서, 망각의
        양상이 달라질 여지가 있습니다. 이 프로젝트는 그 빈자리를 측정합니다.

    - label: 깊이가 추론을 만든다
      text: >-
        파라미터보다 깊이가 추론을 좌우한다는 근거는 언어와 비전 양쪽에서 따로
        보고되었습니다. 같은 FLOPs 아래에서 파라미터를 절반으로 줄인 looped 모델이
        non-looped 기준선의 추론 성능을 넘습니다.
      table:
        head: ["모델 (층 ⊗ loop)", "파라미터", "Val. PPL ↓", "수학 문장제 ↑", "추론 프리미티브 ↑"]
        rows:
          - ["24 ⊗ 1 — non-looped 기준선", "24x", "**7.40**", "29.3", "47.5"]
          - ["12 ⊗ 2 — looped", "12x", "7.90", "**34.3**", "51.2"]
          - ["6 ⊗ 4 — looped", "6x", "8.42", "29.8", "**56.1**"]
        caption: >-
          Saunshi et al., Reasoning with Latent Thoughts (ICLR 2025, arXiv:2502.17416),
          1B 규모 · 동일 FLOPs. looped 모델은 perplexity가 더 나쁜데도 추론 과제에서는
          파라미터가 2–4배인 non-looped 기준선을 넘습니다.

    - text: >-
        비전·언어 쪽에서도 같은 경향이 나타납니다. LoopVL-1B는 학습 토큰이 수십 배
        적은데도 추론 벤치마크에서 2–4B급 모델들을 앞섭니다.
      table:
        head: ["모델", "학습 토큰", "MathVision ↑", "MMK12-Math ↑", "MMMU-Pro ↑", "MMStar ↑"]
        rows:
          - ["**LoopVL-1B**", "0.14T", "**38.49**", "**61.60**", "**38.67**", "**63.47**"]
          - ["Qwen3.5-2B", "36T", "38.40", "35.00", "24.90", "55.10"]
          - ["InternVL3.5-4B", "36.38T", "22.04", "54.80", "38.30", "63.20"]
          - ["gemma-4 E4B-it", "11T", "19.64", "37.40", "33.06", "51.13"]
          - ["LFM2.5-VL-1.6B", "28.1T", "16.51", "30.80", "24.22", "48.53"]

    - label: 벤치마크
      text: >-
        MLLM-CL(arXiv:2506.05453)을 씁니다. 두 트랙으로 나뉘는데, DCL은 서로 다른
        도메인 지식을 차례로 쌓는 IID 설정이고, ACL은 모델의 기본 능력 자체를 차례로
        키우는 non-IID 설정입니다. 학습 순서는 표의 위에서 아래 순입니다.
      table:
        head: ["DCL — 도메인", "과제", "학습 / 평가", "출처"]
        rows:
          - ["RS — 원격탐사", "위성·항공 영상 VQA", "60k / 10k", "RSVQA"]
          - ["Med — 의료", "병리 영상 VQA", "22.8k / 9.8k", "PathVQA"]
          - ["AD — 자율주행", "주행 장면 QA", "60k / 10k", "DriveLM"]
          - ["Sci — 과학", "도표·지도 과학 QA", "33.4k / 8.2k", "AI2D, SciVerse, MapQA, TQA"]
          - ["Fin — 금융", "주식 차트 QA", "60k / 10k", "StockQA (FinVis 재작성)"]

    - table:
        head: ["ACL — 능력", "과제", "학습", "평가셋"]
        rows:
          - ["OCR", "문자 인식", "128.1k", "OCRBench"]
          - ["M&L — 수학·논리", "수식·논리 추론", "526.1k", "MathVista"]
          - ["VP — 시각 지각", "개수 세기 등 지각 과제", "119.9k", "CV-Bench (Counting)"]
          - ["GUI — 에이전트", "화면 이해·조작", "147.3k", "MMTBench-GUI"]
        caption: >-
          지표는 네 가지입니다. MFT는 각 task를 막 배운 직후 정확도의 평균, MFN은
          전체 순차 학습을 끝낸 뒤 모든 task 정확도의 평균, MAA는 매 단계마다의 평균
          정확도를 다시 평균한 값, BWT는 최종 정확도와 학습 직후 정확도의 차이입니다.

    - label: 학습 설정
      text: >-
        LoopVL 백본을 얼리고 어텐션의 q, k, v, o 투영에만 LoRA(r = 32)를 걸어 task를
        차례로 학습합니다. looped 구조에서는 같은 어댑터가 반복 호출마다 다시 적용되므로,
        non-looped 백본과 같은 rank라도 실제로 관여하는 횟수가 다릅니다.

    - label: 결과 — DCL (진행 중)
      text: >-
        5개 도메인을 차례로 학습한 뒤 마지막 Fin 체크포인트로 전 도메인을 평가했습니다.
        zero-shot 평균은 LLaVA-1.5-7B와 비슷한 출발선이지만, 순차 학습 후 평균은
        7배 큰 LLaVA 쪽보다 7.2점 높습니다.
      table:
        head: ["Method", "RS", "Med", "AD", "Sci", "Fin", "MFT ↑", "MFN ↑"]
        rows:
          - ["LLaVA-1.5-7B · Zero-shot", "32.29", "28.28", "15.59", "35.55", "62.56", "34.85", "—"]
          - ["LLaVA-1.5-7B · LoRA-FT", "69.65", "41.59", "25.43", "40.88", "87.45", "64.98", "53.00"]
          - ["**LoopVL · Zero-shot**", "38.83", "29.86", "14.89", "40.16", "58.28", "**36.40**", "—"]
          - ["**LoopVL · LoRA-FT**", "**73.34**", "**46.65**", "**40.78**", "**57.48**", "**82.96**", "—", "**60.24**"]
        caption: >-
          LLaVA 두 행은 MLLM-CL 논문 Table 2의 보고값이고, LoopVL 두 행이 우리 실측값입니다.
          각 도메인 칸은 순차 학습을 모두 끝낸 최종 체크포인트의 점수이며, 그 평균이 MFN입니다.

    - label: 결과 — ACL (진행 중)
      text: >-
        능력 트랙은 순차 학습 전의 zero-shot 결과입니다. 학습을 시작하기도 전에
        4개 능력 평균이 LLaVA-1.5-7B보다 22.6점 높고, 특히 OCR과 수학·논리에서 차이가 큽니다.
      table:
        head: ["Method", "OCR", "M&L", "VP", "GUI", "MFT ↑"]
        rows:
          - ["LLaVA-1.5-7B · Zero-shot", "31.20", "30.20", "**60.79**", "10.00", "33.05"]
          - ["**LoopVL · Zero-shot**", "**70.30**", "**58.90**", "65.48", "**27.88**", "**55.64**"]
        caption: >-
          LLaVA 행은 MLLM-CL 논문 Table 3의 보고값, LoopVL 행이 우리 실측값입니다.

  note: 진행 중인 프로젝트입니다.

- title: 옴니모달 LLM의 토큰 프루닝
  slug: omnimodal-token-pruning
  period: 2026
  summary: 주변 토큰으로 복원되는 토큰을 골라 버려, 오디오·비디오 토큰을 절반 이하로 줄이면서 성능을 지킵니다.
  stack: ["OmniLLM", "Token Pruning", "Qwen2.5-Omni", "Training-free"]

  problem: >-
    오디오와 비디오를 함께 받는 옴니모달 LLM은 입력 토큰 수가 폭발적으로 늘어나
    연산량과 메모리를 크게 잡아먹습니다. 기존 토큰 프루닝은 토큰 하나의 중요도나
    두 토큰 사이의 유사도만 보는데, 여러 토큰이 힘을 합쳐 어떤 토큰을 대신할 수
    있는지는 보지 않습니다.

  approach: >-
    각 레이어에서 토큰에 새로 더해지는 업데이트만 떼어내 직교화한 뒤, 주변 토큰들의
    업데이트로 그것을 복원해봅니다. 잘 복원된다면 그 토큰이 새로 가져온 정보가 없다는
    뜻이므로 버려도 됩니다. 인코더 단계에서는 같은 모달리티 안에서 복원해보고 인코더
    어텐션과 합치고, LLM 내부에서는 같은 시간 구간의 오디오 토큰으로 비디오 업데이트를
    복원해보고 질문 어텐션과 합쳐 레이어를 지날 때마다 점진적으로 줄입니다. 추가 학습이
    필요 없습니다.

  metrics:
    - value: "99.9%"
      label: "토큰 45%에서 원본 대비 성능"
    - value: "3.3배"
      label: "prefill 단축 (5,154 → 1,584ms)"
    - value: "−14.4GiB"
      label: "GPU 메모리 (43.8 → 29.4GiB)"
    - value: "−0.3p"
      label: "정확도 변화 (46.8 → 46.5)"

  result: >-
    Qwen2.5-Omni-7B에서 오디오·비디오 토큰을 45%만 남기고도 전체 토큰을 쓸 때의
    99.9% 성능을 유지했고, 35%까지 줄여도 99.3%였습니다. 같은 토큰 예산에서 비교한
    기존 프루닝 방법들(99.4%, 99.1%)보다 높습니다. 효율 쪽에서는 토큰 35% 기준으로
    정확도를 0.3포인트만 내주면서 prefill 시간을 약 3.3배, GPU 메모리를 14GiB 이상,
    종단 지연을 8.31초에서 5.02초로 줄였습니다.

  figures:
    - src: /assets/images/projects/prune-tradeoff.jpg
      caption: 왼쪽은 각 방법이 남긴 토큰, 오른쪽은 prefill 시간 대비 정확도. 제안 방법은 토큰 45%에서 전체 토큰과 거의 같은 정확도에 도달

- title: 로컬 LLM 육아 상담 챗봇
  slug: local-llm-parenting-chatbot
  period: 2026
  summary: 아이 기록을 외부로 보내지 않는 육아 상담 챗봇. 상용 API 4종과 같은 조건에서 비교했습니다.
  stack: ["Gemma 4 E4B", "LoRA", "Q4_0 양자화", "RAG", "PyTorch"]

  problem: >-
    육아 상담은 아이의 수유·배변·발열 기록처럼 민감한 개인정보를 그대로 다룹니다.
    게다가 부모는 같은 상황을 하루에도 몇 번씩 되묻기 때문에 상용 API를 계속 호출하면
    비용이 빠르게 불어납니다. 개인정보를 밖으로 내보내지 않으면서 비용도 들지 않는
    방법이 필요했습니다.

  approach: >-
    Gemma 4 E4B를 육아 도메인 데이터로 LoRA 파인튜닝한 뒤 Q4_0으로 양자화해
    로컬에서 실행했습니다. 답변은 관찰된 사실 · 일반 설명 · 권장 행동 · 되묻기로 나누어
    내보내고, 각 문장에는 근거가 된 아이 기록을 함께 달게 하되, 기록으로 뒷받침되지
    않는 내용은 따로 표시하도록 했습니다. 비교할 때는 질문 분류 · 기록 조회 ·
    전문자료 검색 · 근거 압축까지의 앞단 파이프라인을 모든 모델에 똑같이 고정하고
    답변 모델만 바꿨습니다.

  metrics:
    - value: "$0"
      label: "API 비용 (상용 $0.018–0.35)"
    - value: "38턴"
      label: "대화 10세트, 모델 5종 비교"
    - value: "로컬 실행"
      label: "외부 API 호출 없음"

  result: >-
    같은 대화 10세트 38턴을 GPT-5.6 Luna, DeepSeek V4 Flash, Gemini 3.6 Flash,
    Claude Haiku 4.5와 나란히 돌려 비교했습니다. 내부 비교에서 답변의 구조와 근거
    표기를 상용 모델과 견줄 만한 수준으로 유지했고, API 호출 없이 아이 기록을 외부로
    내보내지 않고도 같은 형식의 답변을 냈습니다.


  example:
    question: 언제까지 지켜봐도 돼요?
    answer:
      - label: 관찰된 사실
        text: 구토는 2026년 8월 3일과 4일에 각각 1회씩 기록되어 있습니다.
      - label: 일반 설명
        text: 구토와 설사가 함께 나타나는 경우 장염의 가능성을 고려할 수 있으나, 다른 원인도 있을 수 있습니다.
      - label: 권장 행동
        text: 발열 여부와 체온, 수유·수분 섭취량, 젖은 기저귀 수 등 탈수 징후를 확인해야 합니다.

- title: 단일 이미지로부터의 3D 장면 복원
  slug: single-image-3d-scene
  period: 2026
  summary: 사진 한 장을 전경·배경·하늘로 나눠 층별로 복원해, 가려져 있던 배경까지 살린 3D 장면을 만듭니다.
  stack: ["3D Gaussian Splatting", "Diffusion Inpainting", "SAM3", "LLaVA-OneVision"]

  problem: >-
    사진 한 장으로 3D 장면을 만들면, 앞에 선 사람이나 물체가 가린 배경은 정보가
    아예 없습니다. 기존의 학습 없이 동작하는 3DGS 방법들은 장면 전체를 하나의
    가우시안 집합으로 최적화하기 때문에, 가려졌던 배경이 끝내 복원되지 않고
    카메라를 옆으로 옮기면 물체와 배경의 경계가 무너집니다.

  approach: >-
    장면을 전경·배경·하늘 세 개의 층으로 먼저 나눕니다. 전경을 지우고 그 자리에
    가려져 있던 배경을 인페인팅으로 복원한 뒤, 각 층을 서로 파라미터가 겹치지 않는
    독립적인 3D 가우시안 장면으로 재구성합니다. 층끼리 간섭하지 않으므로 경계가
    뭉개지지 않습니다. 마지막에 세 층을 하나로 병합하고 원본 시점을 기준으로 다시
    정합해 novel-view 렌더링에 사용합니다. 별도의 대규모 3D 학습은 필요하지 않습니다.

