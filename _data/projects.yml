- title: 옴니모달 LLM의 토큰 프루닝
  period: 2026
  summary: 주변 토큰으로 복원되는 토큰을 골라 버려, 오디오·비디오 토큰을 절반 이하로 줄이면서 성능을 지킵니다.
  stack: ["OmniLLM", "Token Pruning", "Qwen2.5-Omni", "Training-free"]

  problem: >-
    오디오와 비디오를 함께 받는 옴니모달 LLM은 입력 토큰 수가 폭발적으로 늘어나
    연산량과 메모리를 크게 잡아먹습니다. 기존 토큰 프루닝은 토큰 하나의 중요도나
    두 토큰 사이의 유사도만 보는데, 여러 토큰이 힘을 합쳐 어떤 토큰을 대신할 수
    있는지는 보지 않습니다.

  approach: >-
    각 레이어에서 토큰에 새로 더해지는 업데이트만 떼어내 직교화한 뒤, 주변 토큰들의
    업데이트로 그것을 복원해봅니다. 잘 복원된다면 그 토큰이 새로 가져온 정보가 없다는
    뜻이므로 버려도 됩니다. 인코더 단계에서는 같은 모달리티 안에서 복원해보고 인코더
    어텐션과 합치고, LLM 내부에서는 같은 시간 구간의 오디오 토큰으로 비디오 업데이트를
    복원해보고 질문 어텐션과 합쳐 레이어를 지날 때마다 점진적으로 줄입니다. 추가 학습이
    필요 없습니다.

  metrics:
    - value: "99.9%"
      label: "토큰 45%에서 원본 대비 성능"
    - value: "3.3배"
      label: "prefill 단축 (5,154 → 1,584ms)"
    - value: "−14.4GiB"
      label: "GPU 메모리 (43.8 → 29.4GiB)"
    - value: "−0.3p"
      label: "정확도 변화 (46.8 → 46.5)"

  result: >-
    Qwen2.5-Omni-7B에서 오디오·비디오 토큰을 45%만 남기고도 전체 토큰을 쓸 때의
    99.9% 성능을 유지했고, 35%까지 줄여도 99.3%였습니다. 같은 토큰 예산에서 비교한
    기존 프루닝 방법들(99.4%, 99.1%)보다 높습니다. 효율 쪽에서는 토큰 35% 기준으로
    정확도를 0.3포인트만 내주면서 prefill 시간을 약 3.3배, GPU 메모리를 14GiB 이상,
    종단 지연을 8.31초에서 5.02초로 줄였습니다.

  figures:
    - src: /assets/images/projects/prune-tradeoff.jpg
      caption: 왼쪽은 각 방법이 남긴 토큰, 오른쪽은 prefill 시간 대비 정확도. 제안 방법은 토큰 45%에서 전체 토큰과 거의 같은 정확도에 도달

- title: 로컬 LLM 육아 상담 챗봇
  period: 2026
  summary: 아이 기록을 외부로 보내지 않는 육아 상담 챗봇. 상용 API 4종과 같은 조건에서 비교했습니다.
  stack: ["Gemma 4 E4B", "LoRA", "Q4_0 양자화", "RAG", "PyTorch"]

  problem: >-
    육아 상담은 아이의 수유·배변·발열 기록처럼 민감한 개인정보를 그대로 다룹니다.
    게다가 부모는 같은 상황을 하루에도 몇 번씩 되묻기 때문에 상용 API를 계속 호출하면
    비용이 빠르게 불어납니다. 개인정보를 밖으로 내보내지 않으면서 비용도 들지 않는
    방법이 필요했습니다.

  approach: >-
    Gemma 4 E4B를 육아 도메인 데이터로 LoRA 파인튜닝한 뒤 Q4_0으로 양자화해
    로컬에서 실행했습니다. 답변은 관찰된 사실 · 일반 설명 · 권장 행동 · 되묻기로 나누어
    내보내고, 각 문장에는 근거가 된 아이 기록을 함께 달게 하되, 기록으로 뒷받침되지
    않는 내용은 따로 표시하도록 했습니다. 비교할 때는 질문 분류 · 기록 조회 ·
    전문자료 검색 · 근거 압축까지의 앞단 파이프라인을 모든 모델에 똑같이 고정하고
    답변 모델만 바꿨습니다.

  metrics:
    - value: "$0"
      label: "API 비용 (상용 $0.018–0.35)"
    - value: "38턴"
      label: "대화 10세트, 모델 5종 비교"
    - value: "로컬 실행"
      label: "외부 API 호출 없음"

  result: >-
    같은 대화 10세트 38턴을 GPT-5.6 Luna, DeepSeek V4 Flash, Gemini 3.6 Flash,
    Claude Haiku 4.5와 나란히 돌려 비교했습니다. 내부 비교에서 답변의 구조와 근거
    표기를 상용 모델과 견줄 만한 수준으로 유지했고, API 호출 없이 아이 기록을 외부로
    내보내지 않고도 같은 형식의 답변을 냈습니다.


  example:
    question: 언제까지 지켜봐도 돼요?
    answer:
      - label: 관찰된 사실
        text: 구토는 2026년 8월 3일과 4일에 각각 1회씩 기록되어 있습니다.
      - label: 일반 설명
        text: 구토와 설사가 함께 나타나는 경우 장염의 가능성을 고려할 수 있으나, 다른 원인도 있을 수 있습니다.
      - label: 권장 행동
        text: 발열 여부와 체온, 수유·수분 섭취량, 젖은 기저귀 수 등 탈수 징후를 확인해야 합니다.
