# Publications shown on the home page.
# Groups render in the order listed here; so do the papers inside each group.
#
# Required : venue, title
# Optional : authors
#            image    teaser figure — put the file in
#                     assets/images/publications/ and write the path as
#                     /assets/images/publications/<file>
#                     (a full https:// URL works too)
#            paper    link button "Paper"
#            code     link button "Code"
#            project  link button "Project"
#            poster   link button "Poster" — a local PDF works, same path form
#            video    link button "Video"
#
# Every optional key can be left out; the card just drops that piece.
#
#   - venue: "ICML 2026"
#     title: "..."
#     authors: "J. Lim, S.-E. Kim*"
#     image: /assets/images/publications/icml2026.png
#     paper: https://arxiv.org/abs/xxxx.xxxxx
#     code: https://github.com/you/repo

