<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {%- if page.url == "/" -%}
      {{ site.title }} &middot; {{ site.tagline }}
    {%- else -%}
      {{ page.title }} &middot; {{ site.title }}
    {%- endif -%}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.author.name }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <!-- Pick the theme before first paint so the page never flashes the wrong one. -->
  <script>
    (function () {
      var root = document.documentElement
      root.classList.add('js')
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark')
        }
      } catch (e) {}
    })()
  </script>
  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap">
  <link rel="stylesheet" href="{{ '/public/css/main.css' | relative_url }}">

  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/public/apple-touch-icon-144-precomposed.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/public/favicon.ico' | relative_url }}">

  {% feed_meta %}
</head>
